<div class="booking-popup">
  <div>
    <h3 class="mb-2">
      Booking #{{ dialogData.bookingNumber }} sent <span class="sparkle">✨</span>
    </h3>

    <p>
      Save this booking number. Track your booking anytime under “My Booking” using your phone
      number or booking number.
    </p>
  </div>

  <div class="d-flex justify-end mt-2">
    <button type="submit" class="btn-book text-right" (click)="dialogClose()">Ok</button>
  </div>
</div>
