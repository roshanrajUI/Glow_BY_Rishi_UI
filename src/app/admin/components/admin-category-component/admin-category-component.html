<div class="grid-2 g-5 mt-5 category-card">
  <div class="card">
    <h2 class="card-heading">{{ isEditCategory ? 'Edit' : 'Add' }} Category</h2>
    <form [formGroup]="categoryForm" class="mt-5">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label for="categoryName">Name</mat-label>
        <input
          id="categoryName"
          type="text"
          matInput
          formControlName="categoryName"
          aria-label="Category Name"
        />
        <mat-error class="mb-5">
          <app-field-error-component
            [control]="categoryForm.get('categoryName')"
            [fieldName]="'Category Name'"
          ></app-field-error-component>
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100 mt-1">
        <mat-label>Description</mat-label>
        <textarea
          rows="7"
          type="text"
          matInput
          formControlName="description"
          aria-label="Category Description"
        ></textarea>
        <mat-error class="mb-5">
          <app-field-error-component
            [control]="categoryForm.get('description')"
            [fieldName]="'Description'"
          ></app-field-error-component>
        </mat-error>
      </mat-form-field>
      <div>
        <input
          #categoryImageInput
          type="file"
          name="category_image"
          (change)="onImageSelected($event)"
        />
      </div>
      <div class="d-flex justify-end g-5 mt-3">
        @if (isEditCategory) {
          <button class="btn-book" type="submit" (click)="submitCategory()">Edit Category</button>
          <button
            class="secondary-button"
            type="button"
            (click)="cancelUpdate(); categoryImageInput.value = ''"
          >
            Cancel
          </button>
        } @else {
          <button class="btn-book" type="submit" (click)="submitCategory()">Add Category</button>
        }
      </div>
    </form>
  </div>
  @if (existingCategories.length > 0) {
    <div class="w-100 existing-categories">
      @for (category of existingCategories; track category.categoryId) {
        <div class="card mb-3 d-flex-between">
          <div class="w-75 d-flex wrap g-3">
            <img
              class="category-image"
              [src]="baseUrl + category.imageUrl"
              [alt]="category.categoryName"
              width="100"
              height="100"
            />
            <div>
              <h2 class="card-heading mb-1">{{ category.categoryName }}</h2>
              <p class="description fs-xs">{{ category.description }}</p>
            </div>
          </div>
          <div class="d-flex flex-column g-2">
            <mat-icon class="success-color" (click)="editCategory(category)">edit</mat-icon>
            <mat-icon class="danger-color" (click)="deleteCategory(category)">delete</mat-icon>
          </div>
        </div>
      }
    </div>
  }
</div>
