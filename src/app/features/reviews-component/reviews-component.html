<div class="client-review">
  <h4 class="feature-heading text-center">Reviews</h4>
  <h1 class="feature-description text-center">
    Kind words <br />
    from our <span class="italic">clients.</span>
  </h1>

  <div class="reviews-section">
    @for (booking of bookingReviews; track booking.bookingId) {
      <div class="review-card">
        <p class="review-text fw-light">"{{ booking.reviewText }}"</p>
        <div>
          <div class="d-flex align-center justify-between mt-4">
            <p class="reviewer-name fw-light fs-xs">{{ booking.client.clientName }}</p>

            <span class="review-ratings primary-color">
              <span>
                {{ booking.reviewRating }}
              </span>
              <mat-icon> star_rate </mat-icon>
            </span>
          </div>

          <div class="d-flex flex-wrap g-1 mt-2 align-items-center">
            <span class="review-service-name fw-light">
              <mat-icon>fiber_manual_record</mat-icon>
              {{ getBookingServiceName(booking) }}
            </span>
            <span class="review-city flex-center">
              <mat-icon>fiber_manual_record</mat-icon>
              {{ booking.location }}
            </span>
          </div>
        </div>
      </div>
    }
  </div>
</div>
