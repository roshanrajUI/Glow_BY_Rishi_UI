<div class="services-container common-margin text-center">
  <h4 class="feature-heading">Our Services</h4>
  <h1 class="feature-description">
    Service for <br />
    your <span class="italic">big day.</span>
  </h1>

  <!-- <a href="" class="mt-3">TALK TO US</a> -->
  <div class="service-details">
    @for (service of servicesDetails; track service.title; let i = $index) {
      <div class="service-card">
        <div class="service-image">
          <img [src]="service.image" [alt]="service.title" />
        </div>
        <h3 class="service-title">{{ service.title }}</h3>
        <p class="service-description">
          {{ service.description }}
        </p>
      </div>
    }
  </div>
</div>
