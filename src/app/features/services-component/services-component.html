<div class="services-container common-margin text-center">
  <h4 class="feature-heading">Our Services</h4>
  <h1 class="feature-description">
    Service for <br />
    your <span class="italic">big day.</span>
  </h1>

  <div class="service-details">
    @for (category of sharedService.$categories(); track category.categoryId; let i = $index) {
      <div class="service-card">
        <div class="service-image">
          <img [src]="'../../../assets/images/service-saree.jpg'" [alt]="category.categoryName" />
        </div>
        <h3 class="service-title">{{ category.categoryName }}</h3>
        <p class="service-description">
          {{ category.description }}
        </p>
      </div>
    }
  </div>
</div>
